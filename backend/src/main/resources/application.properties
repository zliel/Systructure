spring.application.name=systructure
# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/systructure
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver
# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# GraphQL
spring.graphql.graphiql.enabled=true
spring.graphql.http.path=/graphql
# JWT Configuration
jwt.secret=${JWT_SECRET:Systructure-jwt-secret-key-for-development-only-this-will-be-changed-in-production}
jwt.access-token-expiration-ms=900000
jwt.refresh-token-expiration-ms=604800000